name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  betterleaks:
    name: betterleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Betterleaks
        run: |
          set -euo pipefail
          VERSION="1.8.1"
          curl -sSL "https://github.com/betterleaks/betterleaks/releases/download/v${VERSION}/betterleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz betterleaks
          sudo mv betterleaks /usr/local/bin/betterleaks
          betterleaks version

      - name: Scan for secrets and personal data
        run: betterleaks git . -v --redact --config .betterleaks.toml --exit-code 1
