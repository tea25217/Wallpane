[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wallpane"
version = "0.1.2"
description = "Per-display wallpaper setter for LMDE / Cinnamon"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Wallpane contributors" }]
keywords = ["wallpaper", "cinnamon", "lmde", "multi-monitor"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]
dependencies = [
    "PySide6>=6.7",
    "Pillow>=10.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wallpane = "wallpane.cli:main"

[project.urls]
Homepage = "https://github.com/tea25217/Wallpane"
Issues = "https://github.com/tea25217/Wallpane/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wallpane = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
